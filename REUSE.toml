# Copyright and licence of every file, declared per path (REUSE Specification 3.3,
# https://reuse.software/spec-3.3/). LICENSES/ holds the licence texts and THIRD-PARTY.md
# describes the third-party material.
#
# No file carries a licence header. The extracted checkers in particular must stay
# byte-identical to the output of rocq/Extraction.v, which `dune build @rocq` checks.
#
# When several annotations match a path, the last one applies. Every annotation uses
# precedence "override", so this file is the only source of the information: REUSE tools
# do not read copyright-like lines inside the files (for example the TPTP attributions
# quoted in the documentation).

version = 1
SPDX-PackageName = "axiom-fuzzer"
SPDX-PackageDownloadLocation = "https://github.com/t3tra-dev/axiom-fuzzer"

# Everything not matched below: the project's own code, documentation and metadata.
[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 t3tra"
SPDX-License-Identifier = "MIT"

# Data: measurements, and corpus manifests (problem names, hashes and TPTP header facts; no
# problem text).
[[annotations]]
path = ["benchmarks/checker.csv", "benchmarks/corpora/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 t3tra"
SPDX-License-Identifier = "CC-BY-4.0"

# OCaml extracted by Rocq from rocq/ (rocq/Extraction.v). Besides the project's own
# definitions it contains OCaml translations of Rocq Stdlib definitions, so each file is
# LGPL-2.1-only as a whole (THIRD-PARTY.md, section 1).
[[annotations]]
path = [
  "lib/proof/avatar_checker.ml",
  "lib/proof/avatar_checker.mli",
  "lib/proof/kernel_checker.ml",
  "lib/proof/kernel_checker.mli",
  "lib/proof/natural_checker.ml",
  "lib/proof/natural_checker.mli",
  "lib/proof/rocq_checker.ml",
  "lib/proof/rocq_checker.mli",
  "lib/proof/wire_checker.ml",
  "lib/proof/wire_checker.mli",
  "lib/proof/wire_normalizer.ml",
  "lib/proof/wire_normalizer.mli",
  "lib/syntax/source_checker.ml",
  "lib/syntax/source_checker.mli",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "INRIA, CNRS and contributors (Rocq Standard Library)",
  "2026 t3tra",
]
SPDX-License-Identifier = "LGPL-2.1-only"

# TPTP Problem Library files, redistributed verbatim (THIRD-PARTY.md, sections 2.1 and 2.2). The
# repository contains no modified TPTP material; the tests that read these files are MIT.
[[annotations]]
path = [
  "benchmarks/problems/tptp/**",
  "tests/fixtures/tptp/Axioms/**",
  "tests/fixtures/tptp/Problems/**",
]
precedence = "override"
SPDX-FileCopyrightText = "1993-onwards Geoff Sutcliffe and Christian Suttner (TPTP Problem Library)"
SPDX-License-Identifier = "LicenseRef-TPTP"
